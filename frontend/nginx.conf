server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/items -> http://backend:8000/items  (same as the Vite dev proxy)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # LLM answers can take a while
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
